name: ci

on:
  push:
    branches: [main]
  pull_request:
  # release.yml runs the same checks before it builds anything.
  workflow_call:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libportaudio2 pulseaudio pulseaudio-utils
      # sounddevice initializes PortAudio at import, and the runner's
      # PortAudio fails Pa_Initialize (-9999, "PulseAudio_Initialize: Can't
      # connect to server") when no sound server runs. A null PulseAudio
      # server is enough; no test plays or records real audio.
      - run: pulseaudio --start --exit-idle-time=-1 && pactl info
      - run: uv sync --locked
      - run: uv run ruff check src tests hooks
      # All suites: integration was left out and stayed red for two months.
      - run: uv run pytest tests -q

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: dashboard }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: dashboard/package-lock.json }
      - run: npm ci
      - run: npx vitest run
      - run: npm ci --prefix ../website
      - name: Check Demo Studio recording and timing
        run: npm test --prefix ../website
      - name: Check website analytics types and build
        run: |
          npm run typecheck:analytics --prefix ../website
          npm run build --prefix ../website
      - run: npm ci --prefix ../desktop --ignore-scripts
      - name: Check desktop icon resources and modes
        run: node --test ../desktop/*.test.js
      - run: npx vue-tsc --noEmit
      - run: npx vite build
