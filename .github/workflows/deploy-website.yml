# Deploys the marketing site to GitHub Pages.
#
# HARD REQUIREMENT: only BUILT output is ever served. The Pages artifact is
# website/dist plus the built Storybook copied into website/dist/storybook -
# no source, no dashboard/src, no website-backend/, no design-concepts/, no
# repo files. This is why we use the artifact-based Pages actions and never
# the legacy publish-a-branch mode (which exposes everything in the folder).
#
# ONE Pages deployment, two folders (#121). Storybook is the reference for
# how the dashboard and widget are meant to look, and it was previously
# reachable only by cloning the repo and running it on port 6006.
#
# One-time setup in the repo: Settings > Pages > Source: "GitHub Actions".
name: deploy-website

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push supersedes a queued one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  manual-quality:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/quality.yml
    permissions:
      contents: read

  build:
    needs: manual-quality
    if: >-
      always() && !cancelled() &&
      ((github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository) ||
       (github.event_name == 'workflow_dispatch' && needs.manual-quality.result == 'success'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/configure-pages@v5
        id: pages
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install and build (website only)
        working-directory: website
        env:
          POSTHOG_PROJECT_TOKEN: ${{ secrets.POSTHOG_PROJECT_TOKEN }}
          POSTHOG_HOST: https://us.i.posthog.com
          # Follow the configured custom domain or project Pages path.
          PAGES_BASE: ${{ steps.pages.outputs.base_path }}/
        run: |
          npm ci
          npm run build
      # A broken story is a broken reference, so this failing fails the
      # deploy rather than publishing a site with a dead /storybook.
      # Storybook renders real WEBSITE components, so it needs the website's
      # dependencies too - `posthog-js` is imported by website/src/analytics.
      # Installing only dashboard's deps fails the build at resolve time.
      - name: Install and build Storybook
        working-directory: dashboard
        env:
          # Answers "which version is this?" on the page itself.
          STORYBOOK_BUILD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          STORYBOOK_BUILD_REF: ${{ github.event.workflow_run.head_branch || github.ref_name }}
        run: |
          npm ci
          npm run build-storybook -- --output-dir ../website/dist/storybook

      - name: Upload ONLY built output (site + storybook)
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
