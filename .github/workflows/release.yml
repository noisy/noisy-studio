# Release gate for the 3.x line: the version-bearing files must agree with
# each other and with the tag, and a pre-release draft appears on GitHub.
# 3.0 ships a native desktop bundle built and signed on macOS.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to (re)build the desktop app for, e.g. v3.0.0-alpha.1"
        required: true

jobs:
  # Guard against the drift that let .claude-plugin/plugin.json ship three
  # releases stale (issue #7): the version-bearing files must agree with
  # each other, and — when released from a tag — with the tag itself.
  verify-version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Versions match across all files (and the tag)
        run: |
          pyproject=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -1)
          dashboard=$(sed -n 's/.*"version": "\(.*\)".*/\1/p' dashboard/package.json | head -1)
          plugin=$(sed -n 's/.*"version": "\(.*\)".*/\1/p' .claude-plugin/plugin.json | head -1)
          codex_plugin=$(sed -n 's/.*"version": "\(.*\)".*/\1/p' .codex-plugin/plugin.json | head -1)
          desktop=$(sed -n 's/.*"version": "\(.*\)".*/\1/p' desktop/package.json | head -1)
          echo "pyproject=$pyproject dashboard=$dashboard plugin=$plugin codex_plugin=$codex_plugin desktop=$desktop"
          if [ "$pyproject" != "$dashboard" ] || [ "$pyproject" != "$plugin" ] || [ "$pyproject" != "$codex_plugin" ] || [ "$pyproject" != "$desktop" ]; then
            echo "::error::version mismatch across files — run scripts/bump_version.py"
            exit 1
          fi
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME#v}"
            if [ "$tag" != "$pyproject" ]; then
              echo "::error::tag $GITHUB_REF_NAME does not match version $pyproject"
              exit 1
            fi
          fi

  # A GitHub Release used to be created by hand and was forgettable — now a
  # draft appears automatically for every version tag. It ships with
  # generated notes; polishing the title/notes and publishing stays a human
  # step on purpose (release names here carry personality).
  github-release:
    needs: verify-version
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag'
    permissions:
      contents: write
    steps:
      - name: Draft the release unless one already exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists — nothing to do"
          else
            prerelease=""
            case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease";; esac
            gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" \
              --draft --generate-notes --title "$GITHUB_REF_NAME" $prerelease
          fi

  # The desktop app is the product in 3.x. macOS runners build the packaged
  # daemon (PyInstaller) and the Electron bundle and attach them to the
  # release, so every tag gets a downloadable app - signed and notarized (#95)
  # (signing/notarisation needs Apple certificates as secrets; #72 family).
  desktop-app:
    needs: [verify-version]
    runs-on: macos-14
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      # Signing + notarization (#95): the canonical repo carries the
      # Developer ID certificate and must sign; a fork without it produces an
      # explicitly UNSIGNED artifact.
      # Secrets (Settings > Secrets and variables > Actions):
      #   MAC_CERT_P12_BASE64   Developer ID Application .p12, base64 -w0
      #   MAC_CERT_PASSWORD     the .p12 export password
      #   APPLE_API_KEY_P8      App Store Connect API key file contents (.p8)
      #   APPLE_API_KEY_ID      its Key ID
      #   APPLE_API_ISSUER      the issuer ID (App Store Connect > Integrations)
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: astral-sh/setup-uv@v5
      # The offline speech engine (faster-whisper + kokoro) is an opt-in
      # extra for pip users, but the app must ship it: its dashboard offers
      # "local (offline) engine" and PyInstaller only bundles what is
      # installed. Without --extra local the daemon shrinks by ~50 MB and
      # that option fails with an install hint (alpha.3 shipped like that).
      - run: uv sync --extra local
      # PyInstaller is a build-time tool, not a project dependency; the npm
      # script expects it in the project venv (.venv/bin/pyinstaller).
      - run: uv pip install pyinstaller
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dashboard, website and desktop dependencies
        run: |
          # The dashboard build type-checks the shared analytics module under
          # website/src, which needs website's packages (posthog-js) installed.
          (cd website && npm ci)
          (cd dashboard && npm ci)
          (cd desktop && npm ci)
      - name: Build the dashboard and the packaged daemon
        working-directory: desktop
        run: |
          npm run build:ui
          npm run build:daemon
      - name: The frozen daemon must know its version
        # Without bundled package metadata it reports "dev" (#100) and every
        # user sees a broken version badge and update check.
        run: |
          engine="desktop/build/daemon/Noisy Studio Engine.app/Contents/MacOS/noisy-studio-daemon"
          built="$("$engine" --version)"
          expected="${TAG#v}"
          echo "daemon reports '$built', tag is '$expected'"
          test "$built" = "$expected"
      - name: Smoke-test frozen agent integrations
        run: uv run python scripts/smoke_integrations.py "desktop/build/daemon/Noisy Studio Engine.app/Contents/MacOS/noisy-studio-daemon"
      - name: Package the macOS app
        working-directory: desktop
        env:
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [ -z "$MAC_CERT_P12_BASE64" ] && [ "$GITHUB_REPOSITORY" = "noisy/noisy-studio" ]; then
            echo "The canonical repository must sign its releases - MAC_CERT_P12_BASE64 is missing."; exit 1
          fi
          if [ -n "$MAC_CERT_P12_BASE64" ]; then
            # Signed + notarized release. electron-builder imports the
            # certificate from CSC_LINK into a throwaway keychain and calls
            # notarytool with the API key. GitHub masks the secret values;
            # on failure electron-builder prints file paths and a sha256 of
            # the password (which is 32 random characters).
            umask 077
            echo "$MAC_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
            printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
            export CSC_LINK="$RUNNER_TEMP/developer-id.p12"
            export APPLE_API_KEY="$RUNNER_TEMP/AuthKey.p8"
            # With auto-discovery off electron-builder never even looks in the
            # keychain it just imported into (it needs an explicit identity
            # name) - so turn discovery on for THIS command: the throwaway
            # keychain holds exactly one identity, ours.
            CSC_IDENTITY_AUTO_DISCOVERY=true npx electron-builder --mac --publish never
            # A "successful" build that quietly skipped signing must fail here,
            # not on a user's first launch.
            app="dist/mac-arm64/Noisy Studio.app"
            codesign -dvv "$app" 2>&1 | grep -E "^Authority=Developer ID Application" || { echo "NOT signed with a Developer ID"; codesign -dvv "$app" 2>&1 | head -5; exit 1; }
            verdict="$(spctl -a -vv -t exec "$app" 2>&1)"; echo "$verdict"
            echo "$verdict" | grep -q "source=Notarized Developer ID" || { echo "NOT notarized"; exit 1; }
            engine="$app/Contents/Helpers/Noisy Studio Engine.app"
            codesign -dvv "$engine" 2>&1 | grep -E "^Authority=Developer ID Application" || { echo "engine NOT signed"; exit 1; }
            # Strict, deep verification of both bundles (the outer --deep does
            # not descend into a nested app) and the stapled notarization
            # ticket on the app and the disk image.
            codesign --verify --deep --strict --verbose=2 "$app"
            codesign --verify --deep --strict --verbose=2 "$engine"
            xcrun stapler validate "$app"
            # electron-builder notarizes the .app only. The disk image needs its
            # own submission before a ticket can be stapled to it; stapling
            # lets Gatekeeper accept the download without a network round-trip.
            for dmg in dist/*.dmg; do
              xcrun notarytool submit "$dmg" --key "$APPLE_API_KEY" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" --wait
              xcrun stapler staple "$dmg"
              xcrun stapler validate "$dmg"
            done
          else
            # Forks without a certificate: an UNSIGNED build (not even ad-hoc:
            # identity=null skips signing), named so nobody mistakes it for a
            # release artifact.
            echo "No Developer ID certificate in secrets - building UNSIGNED."
            npx electron-builder --mac --publish never -c.mac.identity=null -c.mac.notarize=false -c.artifactName='${productName}-${version}-${arch}-UNSIGNED.${ext}'
          fi
      - name: Smoke-test the packaged app
        # Launches the real .app: a missing module, a broken engine bundle or
        # a wrong version fails the release instead of a user's first launch.
        working-directory: desktop
        run: scripts/smoke.sh "dist/mac-arm64/Noisy Studio.app" "${TAG#v}"
      - name: Attach the app to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The draft may not exist yet on a fresh tag (github-release job
          # runs in parallel); wait for it briefly rather than racing.
          for i in $(seq 1 30); do
            gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 && break
            sleep 10
          done
          ls -la desktop/dist
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber desktop/dist/*.dmg desktop/dist/*.zip
