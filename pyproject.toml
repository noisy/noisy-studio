[project]
name = "noisy-coding"
version = "3.0.0-alpha.9"
description = "Voice coding for Claude Code — talk to your agent while it works (Grok/xAI voice backend)"
readme = "README.md"
authors = [
    { name = "Krzysztof Szumny", email = "noisy.pl@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    # Exact pins, belt-and-suspenders with the lockfile-driven native
    # install: upgrades are a deliberate edit here, followed by `uv lock`
    # and the test suite — never a surprise from the resolver.
    "httpx==0.28.1",
    "mcp[cli]==1.28.1",
    "numpy==2.5.1",
    "sounddevice==0.5.5",
    "websockets==16.0",
    # Global push-to-talk hotkey (#25): a CGEventTap needs the Quartz
    # bindings - macOS only, source-only Linux development runs without it.
    "pyobjc-framework-Quartz==12.1; sys_platform == 'darwin'",
]

[project.scripts]
noisy-coding-mcp = "noisy_coding.server:main"
noisy-coding-listener = "noisy_coding.listener.daemon:main"
noisy-coding-mobile = "noisy_coding.mobile_server:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[project.optional-dependencies]
# Local (offline) STT — heavy, so opt-in: pip install 'noisy-coding[local]'
local = [
    "faster-whisper>=1.1.1",
    "kokoro-onnx>=0.6.1",
]

[dependency-groups]
dev = [
    "pre-commit>=4.3,<5",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "ruff>=0.15.20",
]
